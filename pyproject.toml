[project]
name = "langsfer"
version = "0.1.1-dev0"
description = "A library for language transfer methods and algorithms. "
authors = [
    {name = "Anes Benmerzoug", email = "anes.benmerzoug@gmail.com"}
]
maintainers = [
    {name = "Anes Benmerzoug", email = "anes.benmerzoug@gmail.com"}
]
license = "LGPL-2.1-only"
readme = "README.md"
keywords = ["language-transfer", ""]
dynamic = [ "classifiers" ]
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch (>=2.0.0,<3.0.0)",
    "transformers (>=4.26.0,<5.0.0)",
    "gensim (>=4.4.0,<5.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "scikit-learn (>=1.4.2,<2.0.0)",
    "more-itertools (>=10.5.0)",
]

[project.urls]
repository = "https://github.com/AnesBenmerzoug/langsfer"

[tool.poetry]
packages = [
    {include = "langsfer", from = "src"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Science/Research",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bumpversion]
current_version = "0.1.1-dev0"
commit = false
tag = false
allow_dirty = true
# https://github.com/callowayproject/bump-my-version?tab=readme-ov-file#add-support-for-pre-release-versions
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -                             # dash separator for pre-release section
        (?P<pre_l>[a-zA-Z-]+)         # pre-release label
        (?P<pre_n>0|[1-9]\\d*)        # pre-release version number
    )?                                # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
files = [
    { filename = "src/langsfer/__init__.py", search = '__version__ = "{current_version}"', replace = '__version__ = "{new_version}"' },
    { filename = "pyproject.toml", search = 'version = "{current_version}"', replace = 'version = "{new_version}"' }
]

[tool.bumpversion.parts.pre_l]
values = ["dev", "final"]
optional_value = "final"

[tool.poetry.group.dev.dependencies]
bump-my-version = "^0.27.0"
pre-commit = "^4.0.1"
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pytest-timeout = "^2.3.1"
pytest-profiling = "^1.7.0"
hypothesis = {extras = ["numpy"], version = "^6.115.0"}
jupyterlab = "^4.3.0"
iprogress = "^0.4"
ipywidgets = "^8.1.5"
datasets = "^4.5.0"
accelerate = "^1.12.0"
tensorboard = "^2.20.0"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"

[tool.pytest.ini_options]
addopts = "-vv --failed-first --durations=10 --profile-svg --cov=langsfer --cov-report=term-missing --cov-report=xml"
testpaths = [
    "tests"
]
timeout = 300
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true
log_level = "INFO"

[tool.coverage.run]
source_pkgs = ["langsfer", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
langsfer = ["src/langsfer", "*/langsfer/src/langsfer"]
tests = ["tests", "*/langsfer/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
